name: Build LibreTivi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v5

      - name: 2. 安装 JDK 17 环境
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 自动生成完整项目源码与配置文件
        run: |
          python3 - << 'PYEOF'
          import os, pathlib

          os.makedirs("app/src/main/java/io/libretivi/app", exist_ok=True)

          pathlib.Path("settings.gradle.kts").write_text(r'''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LibreTivi"
          include(":app")
          '''.strip(), encoding="utf-8")

          pathlib.Path("build.gradle.kts").write_text(r'''
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          '''.strip(), encoding="utf-8")

          pathlib.Path("gradle.properties").write_text(r'''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          '''.strip(), encoding="utf-8")

          pathlib.Path("app/build.gradle.kts").write_text(r'''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "io.libretivi.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "io.libretivi.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 132
                  versionName = "1.3.2-ProFree"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              val media3Version = "1.4.1"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.annotation:annotation:1.8.0")
              implementation("androidx.media3:media3-exoplayer:$media3Version")
              implementation("androidx.media3:media3-exoplayer-hls:$media3Version")
              implementation("androidx.media3:media3-exoplayer-dash:$media3Version")
              implementation("androidx.media3:media3-exoplayer-rtsp:$media3Version")
              implementation("androidx.media3:media3-datasource-rtmp:$media3Version")
              implementation("androidx.media3:media3-ui:$media3Version")
          }
          '''.strip(), encoding="utf-8")

          pathlib.Path("app/src/main/AndroidManifest.xml").write_text(r'''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="TiviMini Free"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''.strip(), encoding="utf-8")

          pathlib.Path("app/src/main/java/io/libretivi/app/MainActivity.kt").write_text(r'''
          @file:Suppress("DEPRECATION")
